name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone Windows x64 executable
        shell: pwsh
        run: >-
          dotnet publish ./MonitorDeck/MonitorDeck.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./release
      - name: Make downloadable release archive
        shell: pwsh
        run: Compress-Archive -Path './release/*' -DestinationPath 'MonitorDeck-windows-x64.zip' -Force
      - name: Publish prerelease on GitHub
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: MonitorDeck-windows-x64.zip
